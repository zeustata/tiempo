<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Fondo Azul Asturias -->
  <rect width="900" height="600" fill="#0066cc" rx="36"/>
  
  <g fill="#ffd700" stroke="#d4af37" stroke-linejoin="round">
    <!-- Cruz de la Victoria - Brazo Vertical Principal -->
    <path d="M 292,80 
             L 308,80 
             L 314,92 
             L 314,240 
             L 435,240 
             L 447,234 
             L 447,266 
             L 435,260 
             L 314,260 
             L 314,500 
             L 322,515 
             L 278,515 
             L 286,500 
             L 286,260 
             L 165,260 
             L 153,266 
             L 153,234 
             L 165,240 
             L 286,240 
             L 286,92 
             Z" 
          stroke-width="3"/>
          
    <!-- Remates ensanchados / Brazos de la Cruz de la Victoria -->
    <!-- Remate Superior -->
    <path d="M 280,80 L 320,80 L 328,60 L 272,60 Z" />
    <circle cx="300" cy="55" r="9" />
    
    <!-- Remate Izquierdo -->
    <path d="M 155,225 L 155,275 L 135,283 L 135,217 Z" />
    <circle cx="130" cy="250" r="9" />
    
    <!-- Remate Derecho -->
    <path d="M 445,225 L 445,275 L 465,283 L 465,217 Z" />
    <circle cx="470" cy="250" r="9" />
    
    <!-- Remate Inferior / Base -->
    <path d="M 270,515 L 330,515 L 340,535 L 260,535 Z" />
    
    <!-- Gemas centrales y decoraciones de la Cruz -->
    <circle cx="300" cy="250" r="14" fill="#e11d48" stroke="#ffd700" stroke-width="4"/>
    <circle cx="300" cy="160" r="6" fill="#0284c7" stroke="#ffd700" stroke-width="2"/>
    <circle cx="300" cy="350" r="6" fill="#0284c7" stroke="#ffd700" stroke-width="2"/>
    <circle cx="225" cy="250" r="6" fill="#10b981" stroke="#ffd700" stroke-width="2"/>
    <circle cx="375" cy="250" r="6" fill="#10b981" stroke="#ffd700" stroke-width="2"/>

    <!-- Letras Griegas Colgantes: Alfa (A) a la izquierda y Omega (ω) a la derecha -->
    <!-- Cadenas de suspensión -->
    <line x1="210" y1="260" x2="210" y2="300" stroke="#ffd700" stroke-width="4"/>
    <line x1="390" y1="260" x2="390" y2="300" stroke="#ffd700" stroke-width="4"/>
  </g>

  <!-- Letra Alfa (Α) mayúscula -->
  <g fill="#ffd700" stroke="#b45309" stroke-width="2">
    <path d="M 210,305 L 188,365 L 200,365 L 205,350 L 215,350 L 220,365 L 232,365 Z M 210,323 L 207,338 L 213,338 Z"/>
  </g>

  <!-- Letra Omega (ω) minúscula tradicional de la bandera -->
  <g fill="#ffd700" stroke="#b45309" stroke-width="2">
    <path d="M 372,345 C 372,330 380,318 390,318 C 396,318 400,324 402,329 C 404,324 408,318 414,318 C 424,318 432,330 432,345 C 432,362 422,365 413,365 C 406,365 402,358 402,350 C 402,358 398,365 391,365 C 382,365 372,362 372,345 Z M 383,344 C 383,354 387,358 391,358 C 396,358 399,352 399,343 C 399,332 395,326 390,326 C 385,326 383,333 383,344 Z M 405,343 C 405,352 408,358 413,358 C 417,358 421,354 421,344 C 421,333 419,326 414,326 C 409,326 405,332 405,343 Z"/>
  </g>
</svg>
