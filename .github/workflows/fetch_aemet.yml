name: Fetch Official Data (AEMET & Nieve)

on:
  schedule:
    # Latido maestro cada 15 minutos:
    # - Avisos AEMET se verifican cada 15 minutos
    # - Partes de nieve se verifican de forma inteligente con guardia de 50 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: 'main'
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Fetch AEMET Alerts
        run: node scripts/fetch_alerts.js

      - name: Fetch Snow Report
        run: node scripts/fetch_snow_report.js
        
      - name: Commit and Push to data branch
        run: |
          git config --global user.name "MeteoAstur-Bot"
          git config --global user.email "bot@meteoastur.local"
          git checkout -B data
          git add data/avisos-asturias.json || true
          git add data/partes-nieve.json || true
          git commit -m "Actualizados datos oficiales (AEMET + Nieve) - $(date)" || echo "No hay cambios en los datos oficiales"
          git push -f origin data
