name: Fetch AEMET Alerts

on:
  schedule:
    # Ejecutar cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: 'main'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Fetch Alerts
        run: node scripts/fetch_alerts.js
        
      - name: Commit and Push to data branch
        run: |
          git config --global user.name "MeteoAstur-Bot"
          git config --global user.email "bot@meteoastur.local"
          git checkout -B data
          git add data/avisos-asturias.json
          git commit -m "Actualizados avisos AEMET - $(date)" || echo "No hay cambios en los avisos"
          git push -f origin data
