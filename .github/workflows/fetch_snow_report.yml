name: Fetch Snow Report

on:
  schedule:
    # Temporada invernal (Noviembre a Abril): 5 actualizaciones clave al día (07:30, 09:30, 11:30, 14:30, 16:30 UTC)
    - cron: '30 7,9,11,14,16 * 1,2,3,4,11,12 *'
    # Fuera de temporada (Mayo a Octubre): latido semanal los domingos a las 08:00 UTC para verificar salud del servicio
    - cron: '0 8 * 5,6,7,8,9,10 0'
  workflow_dispatch:

jobs:
  update-snow-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Fetch Snow Report
        run: node scripts/fetch_snow_report.js

      - name: Commit and Push to data branch
        run: |
          git config --global user.name "MeteoAstur-Bot"
          git config --global user.email "bot@meteoastur.local"
          git checkout -B data
          # Preservar avisos AEMET vigentes de origin/data si existen
          git checkout origin/data -- data/avisos-asturias.json || true
          git add data/partes-nieve.json
          git add data/avisos-asturias.json || true
          git commit -m "Actualizado parte de nieve - $(date)" || echo "No hay cambios en los partes de nieve"
          git push -f origin data

